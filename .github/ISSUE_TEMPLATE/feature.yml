name: Feature request
description: Suggest a change or something new.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? Who is it for (parents, IT)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd suggest
