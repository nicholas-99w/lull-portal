# Publishes the portal's image to GitHub's container registry, so servers pull
# it instead of building it (docs/administration.md, "Deploy" and "Update").
#
#   ghcr.io/nicholas-99w/lull-portal:X.Y.Z   one release
#   ghcr.io/nicholas-99w/lull-portal:X.Y     the newest X.Y.* release
#   ghcr.io/nicholas-99w/lull-portal:X       the newest X.* release (from 1.0.0)
#   ghcr.io/nicholas-99w/lull-portal:latest  the newest release
#
# Runs when a release is published, and every Monday to rebuild the newest
# release on the .NET base images' latest patches: its tags then move to the
# rebuilt image (the same code), which ./update.sh pulls. By hand (Actions, Run
# workflow) it publishes the newest release, or the tag given.
#
# Only v* tags on main are published, the same rule as update.sh. Before
# pushing, the image must start under compose and answer /healthz (the full
# checks are in ci.yml, which ran on that commit before it was released).
# Actions are pinned to full commit SHAs, as in ci.yml.
name: Publish image

on:
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z); empty for the newest release"
        required: false
        default: ""

permissions:
  contents: read

# One publish at a time, never cancelled: a cancelled push could leave the tags half moved.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the build provenance
      attestations: write
    env:
      POSTGRES_PASSWORD: smoke-postgres-password
      LULL_APP_DB_PASSWORD: smoke-app-db-password
      LULL_ENROLMENT_SECRET: smoke-enrolment-secret-0123
      # The smoke test's local image, never the published name.
      LULL_PORTAL_IMAGE: lull-portal:smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, and main, to choose the release
          persist-credentials: false

      - name: Choose the release and its tags
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Release tags on main, newest version first.
          releases=$(for t in $(git tag --list 'v[0-9]*' --sort=-version:refname); do
            if [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && git merge-base --is-ancestor "$t" origin/main; then echo "$t"; fi
          done)
          newest() { grep -E "^$1" <<<"$releases" | head -1 || true; }

          if [ "$EVENT" = release ]; then tag=$RELEASE_TAG; else tag=${INPUT_TAG:-$(newest v)}; fi
          [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::'$tag' isn't a vX.Y.Z release tag"; exit 1; }
          grep -qx "$tag" <<<"$releases" || { echo "::error::$tag isn't on main: not published"; exit 1; }
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; version=${tag#v}

          image=ghcr.io/$(tr "[:upper:]" "[:lower:]" <<<"$GITHUB_REPOSITORY")
          # A moving tag goes to this release only if it's the newest one it covers,
          # so publishing 0.9.2 after 0.10.0 doesn't take latest back.
          tags=$image:$version
          [ "$(newest "v$major\\.$minor\\.")" = "$tag" ] && tags+=",$image:$major.$minor"
          [ "$major" != 0 ] && [ "$(newest "v$major\\.")" = "$tag" ] && tags+=",$image:$major"
          [ "$(newest v)" = "$tag" ] && tags+=",$image:latest"

          git -c advice.detachedHead=false checkout --quiet "$tag"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$image"
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $tag as: ${tags//,/ }"

      - name: Smoke test (migrate, start, health)
        run: |
          docker compose up -d --build --wait
          curl -fsS http://localhost:8080/healthz
      - name: Smoke test logs
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v

      # QEMU only runs the arm64 image's few RUN steps: the .NET build itself
      # cross-compiles on the runner (the Dockerfile's BUILDPLATFORM stage).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # the checked-out release, not the workflow's own ref
          platforms: linux/amd64,linux/arm64
          pull: true # the base images' latest patches
          no-cache: ${{ github.event_name == 'schedule' }} # the weekly rebuild must rebuild
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Lull portal
            org.opencontainers.image.description=The Lull parent portal
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            org.opencontainers.image.licenses=MIT

      # Signed provenance (which workflow built which commit), checkable with
      # `gh attestation verify oci://ghcr.io/nicholas-99w/lull-portal:X.Y.Z --owner nicholas-99w`.
      # Needs a public repository: GitHub doesn't offer it for a private one on a personal account.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
