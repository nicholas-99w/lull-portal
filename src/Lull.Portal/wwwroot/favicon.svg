<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" width="824" height="824">
  <!-- Portal favicon: the Lull app icon cropped to its body (viewBox), so it fills the tab.
       Lull app icon. Master artwork on Apple's 1024 macOS icon grid:
       824x824 body, inset 100px, corner radius ~185. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3F8F"/>
      <stop offset="1" stop-color="#1B1D4A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D66"/>
      <stop offset="1" stop-color="#20235A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Display -->
  <g filter="url(#shadow)">
    <!-- stand -->
    <path d="M462 668 L448 742 H576 L562 668 Z" fill="#C9CCF2"/>
    <rect x="404" y="736" width="216" height="22" rx="11" fill="#E8E9FB"/>
    <!-- bezel -->
    <rect x="252" y="300" width="520" height="384" rx="44" fill="#E8E9FB"/>
    <!-- screen -->
    <rect x="282" y="330" width="460" height="300" rx="22" fill="url(#screen)"/>
  </g>

  <!-- Closed eyes -->
  <g fill="none" stroke="#E8E9FB" stroke-width="20" stroke-linecap="round">
    <path d="M392 482 Q432 516 472 482"/>
    <path d="M552 482 Q592 516 632 482"/>
  </g>

  <!-- Zz -->
  <g fill="none" stroke="#FFD27A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 200 H760 L700 260 H760" stroke-width="18"/>
    <path d="M790 270 H826 L790 306 H826" stroke-width="13"/>
  </g>
</svg>
